name: Deploy Python Playground
on:
  push:
    branches:
      - main
  workflow_dispatch:
        
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check website files
        run: |
          test -f docs/index.html
          test -f docs/style.css
      
      - name: validate html
        run: |
          npm install -g html-validate
          html-validate docs/index.html

      - name: check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress docs/**/*.html

      - name: validate css
        run: |
          test -s docs/style.css
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup pages
        uses: actions/configure-pages@v5

      - name: upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: deploy to pages
        uses: actions/deploy-pages@v4